[build-system]
# 68 is what Ubuntu 24.04 ships, so the package builds with the distro toolchain (pybuild, no network). The license
# is therefore the table form, which newer setuptools only warns about.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-sentinel"
dynamic = ["version"]
description = "Out-of-band security sentinel for Linux: per-task cgroups, nftables containment, connect-time attribution (NFLOG) for TCP/UDP/QUIC/DNS, and a grammar-constrained local LLM supervisor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nick" }]
keywords = ["security", "cgroups", "nftables", "nflog", "sock_diag", "netlink", "llm", "sentinel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
# No runtime dependencies. The safety gate (github.com/nkaralus/engine-telemetry-bus) is VENDORED, pinned to one commit,
# under cora_sentinel/_vendor/subnetbus (see VENDOR.lock there and tools/vendor_bus.py), so a wheel installs offline and
# the code that ships is the code the tests ran against.
dependencies = []

[project.optional-dependencies]
model = ["llama-cpp-python"]          # the local GGUF supervisor; everything else runs without it
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
cora-sentinel = "cora_sentinel.daemon:main"
cora-run = "cora_sentinel.run:main"
cora-demo = "cora_sentinel.demo:main"
cora-cgroup = "cora_sentinel.cgroup:main"
cora-firewall = "cora_sentinel.firewall:main"
cora-floor = "cora_sentinel.nftsets:main"
cora-blocklist = "cora_sentinel.blocklist:main"
cora-report = "cora_sentinel.report:main"
cora-selfcheck = "cora_sentinel.selfcheck:main"

[tool.setuptools.dynamic]
version = { attr = "cora_sentinel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# the vendored bus's own MIT notice and its lock travel with it (the license requires the notice in every copy)
[tool.setuptools.package-data]
"cora_sentinel._vendor.subnetbus" = ["LICENSE", "VENDOR.lock"]
"cora_sentinel._vendor.mule" = ["LICENSE", "NOTICE", "VENDOR.lock", "spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
